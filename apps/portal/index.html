<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme colour: warm paper in light, near-black in dark -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F4EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0C" />
    <meta name="apple-mobile-web-app-title" content="Kipkiren WS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Kipkiren Web Services · Precision websites, quietly operated</title>
    <meta name="description" content="A managed web services studio from Nairobi. Design, engineering, SEO and hosting delivered by a single senior team." />
    <link rel="canonical" href="https://ws.kipkiren.co.ke/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kipkiren Web Services" />
    <meta property="og:title" content="Kipkiren Web Services · Precision websites, quietly operated" />
    <meta property="og:description" content="A managed web services studio from Nairobi. Design, engineering, SEO and hosting delivered by a single senior team." />
    <meta property="og:url" content="https://ws.kipkiren.co.ke/" />
    <meta property="og:image" content="https://ws.kipkiren.co.ke/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kipkiren Web Services · Precision websites, quietly operated" />
    <meta name="twitter:description" content="A managed web services studio from Nairobi. Design, engineering, SEO and hosting from one senior team." />
    <meta name="twitter:image" content="https://ws.kipkiren.co.ke/og.png" />

    <!-- Structured data: who we are, for search engines and AI answers -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://ws.kipkiren.co.ke/#business",
        "name": "Kipkiren Web Services",
        "alternateName": "Kipkiren WS",
        "url": "https://ws.kipkiren.co.ke/",
        "logo": "https://ws.kipkiren.co.ke/icon-512.png",
        "image": "https://ws.kipkiren.co.ke/og.png",
        "description": "A managed web services studio from Nairobi. Website design, engineering, SEO and managed hosting, with a fixed-price proforma before any work starts.",
        "email": "studio@kipkiren.co.ke",
        "parentOrganization": { "@type": "Organization", "name": "Kipkiren Teknolojia" },
        "address": { "@type": "PostalAddress", "addressLocality": "Nairobi", "addressCountry": "KE" },
        "areaServed": { "@type": "Country", "name": "Kenya" },
        "currenciesAccepted": "KES",
        "paymentAccepted": "M-Pesa, Card, Bank transfer",
        "knowsAbout": ["Website design", "Web development", "SEO", "Managed hosting", "M-Pesa integration"],
        "makesOffer": [
          { "@type": "Offer", "name": "Starter website build", "price": "45000", "priceCurrency": "KES" },
          { "@type": "Offer", "name": "Growth website build", "price": "89000", "priceCurrency": "KES" },
          { "@type": "Offer", "name": "Business website build", "price": "165000", "priceCurrency": "KES" }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
